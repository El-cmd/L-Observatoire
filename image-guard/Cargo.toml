[package]
name = "image-guard"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
# Pure-Rust decoders only: PNG, JPEG (zune-jpeg), WebP (image-webp) and GIF.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }

[profile.release]
strip = true
lto = "thin"
