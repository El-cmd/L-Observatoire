<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000"><meta name="description" content="L’Observatoire, simplement une conversation.">
  <title>L’Observatoire</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/vendor/highlight/github-dark.min.css"><link rel="stylesheet" href="/vendor/katex/katex.min.css"><link rel="stylesheet" href="/style.css"><script src="/vendor/highlight/highlight.min.js" defer></script><script src="/vendor/katex/katex.min.js" defer></script><script src="/render.js" defer></script><script src="/app.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Conversations">
    <div class="sidebar-header"><a class="brand" href="/">L’Observatoire</a><button id="sidebar-close" class="icon-button" aria-label="Fermer la barre latérale" title="Fermer la barre latérale"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button></div>
    <button class="new-chat" id="new-chat" title="Ctrl / Cmd + Maj + N"><svg viewBox="0 0 24 24"><path d="M12 4H6a3 3 0 0 0-3 3v11a3 3 0 0 0 3 3h11a3 3 0 0 0 3-3v-6M15 3l6 6M11 13l-1 4 4-1 8-8a2.1 2.1 0 0 0-3-3z"/></svg><span>Nouveau chat</span></button>
    <div class="history-label">Conversations</div>
    <div class="history" id="history" aria-label="Historique des conversations"></div>
  </aside>
  <button id="sidebar-backdrop" class="sidebar-backdrop" aria-label="Fermer les conversations" tabindex="-1"></button>
  <div class="workspace empty" id="workspace">
    <header class="topbar"><button id="menu" class="icon-button" aria-label="Ouvrir les conversations" title="Conversations"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button><span class="topbar-title">L’Observatoire</span><span id="connection" class="sr-only" role="status">Connexion…</span></header>
    <main class="main" id="main">
      <section class="welcome" id="welcome"><h1>Qu’avez-vous en tête aujourd’hui ?</h1></section>
      <div id="messages" class="messages" role="log" aria-label="Conversation" aria-live="polite" aria-relevant="additions"></div>
    </main>
    <div class="composer-area">
      <div id="error" class="error" role="alert" hidden></div>
      <section id="generation-settings" class="generation-settings" aria-label="Réglages de génération" hidden>
        <div class="generation-heading"><span>Réglages</span><button id="generation-close" type="button" class="icon-button" aria-label="Fermer les réglages"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
        <label for="effort">Réflexion</label>
        <select id="effort"><option value="none">Désactivée</option><option value="low">Légère</option><option value="medium">Intermédiaire</option><option value="xhigh">Approfondie</option></select>
        <label for="temperature">Température <output id="temperature-value" for="temperature">0,7</output></label>
        <input id="temperature" type="range" min="0" max="2" step="0.1" value="0.7">
        <div class="temperature-scale"><span>Précis</span><span>Varié</span></div>
        <p>Appliqué aux prochains messages.</p>
      </section>
      <form id="chat-form" class="composer">
        <label class="sr-only" for="prompt">Votre message</label>
        <textarea id="prompt" rows="1" placeholder="Demander à L’Observatoire" maxlength="100000"></textarea>
        <button id="generation-toggle" type="button" class="generation-toggle icon-button" aria-label="Régler la température et la réflexion" title="Température et réflexion" aria-controls="generation-settings" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h6m4 0h6M4 17h10m4 0h2"/><circle cx="12" cy="7" r="2"/><circle cx="16" cy="17" r="2"/></svg></button>
        <button id="send" type="submit" class="send-button" aria-label="Envoyer le message" disabled><svg viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
        <button id="stop" type="button" class="stop-button" aria-label="Arrêter la réponse" hidden><svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1"/></svg></button>
      </form>
      <p class="composer-note">L’Observatoire peut faire des erreurs.</p>
    </div>
  </div>
</div>
</body>
</html>
