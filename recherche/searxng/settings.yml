# SearXNG de la recherche web de L'Observatoire : instance privée (réseau interne, aucun port publié), appelée seulement
# par le service de recherche (recherche/service). Sortie par le proxy « sortie ». Réglages par défaut, sauf ce qui suit.
use_default_settings:
  engines:
    keep_only:
      - brave
      - startpage
      - yandex
      - yahoo
      - duckduckgo
      - bing
      - wikipedia

# Testé le 15/11/2026 depuis l'adresse du VPS (SearXNG à part, chaque moteur seul, 3 questions espacées de 4 s :
# actualité en français, question de dev en anglais, recette), pertinents = titre ou extrait reprenant la question :
# - startpage (résultats de Google) : 10/10 pertinents sur les trois ; brave : 18 à 25, tous pertinents, quand il n'est
#   pas sollicité en rafale (il refuse les rafales : « too many requests ») ; yandex : 15 sur 15 ; yahoo : 7 sur 7.
# - duckduckgo : délai dépassé deux fois sur trois depuis cette adresse (gardé, poids normal, quand il répond).
# - bing : bon en français sur une requête courte, 0 sur 10 sur la question de dev (ne retient que le premier mot) :
#   moteur de secours (service/multi.py) et poids faible.
# - Refusent cette adresse : google, qwant, mojeek, dogpile (« access denied »), yep (erreur HTTP).
# - Non retenus : mwmbl (petit index, 1 résultat sur la question de dev), naver et seznam (coréen et tchèque).
# - Moteurs dev de SearXNG (stackoverflow, github, mdn, pypi…) : recherches par mots-clés dans un catalogue, hors sujet
#   sur une vraie question (essai du 12/11/2026). Non retenus.
# Poids : yandex (index russe) et bing comptent moins dans le classement ; le service espace les requêtes (1,5 s).
engines:
  - name: startpage
    inactive: false
    disabled: false
  - name: yandex
    disabled: false
    weight: 0.7
  - name: yahoo
    disabled: false
    weight: 0.8
  - name: bing
    disabled: false
    weight: 0.5

general:
  instance_name: "Recherche de L’Observatoire"
  debug: false
  enable_metrics: false

search:
  safe_search: 1
  autocomplete: ""
  default_lang: "fr-FR"
  formats:
    - json

server:
  # secret_key : variable SEARXNG_SECRET (fichier .env)
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0
  pool_connections: 20
  pool_maxsize: 10
  proxies:
    all://:
      - http://10.231.30.3:3128

ui:
  static_use_hash: true
