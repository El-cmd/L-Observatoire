# Sources officielles par thème. La planification classe chaque question dans un thème ; les pages des domaines de
# ce thème sont alors lues en premier et gardent un bonus au classement des passages (« source officielle »).
# Un domaine vaut pour ses sous-domaines (« gouv.fr » : service-public.gouv.fr, legifrance.gouv.fr…).
# requetes_site : pour ce thème, une requête de plus par domaine, limitée à ce site (« … site:gouv.fr »), pour que
# les pages officielles soient parmi les résultats même quand les moteurs les classent loin.
# Les wikis et les sources de développement de multi.SOURCES_FAVORISEES restent favorisés pour tous les thèmes.

[themes.administratif]
description = "démarches, droits, prestations et aides sociales, Sécurité sociale, impôts, travail et salaires, retraite, logement, lois et règlements en France"
requetes_site = ["gouv.fr", "ameli.fr"]
domaines = [
  "gouv.fr", "ameli.fr", "caf.fr", "urssaf.fr", "francetravail.fr", "msa.fr", "lassuranceretraite.fr",
  "info-retraite.fr", "agirc-arrco.fr", "net-entreprises.fr", "vie-publique.fr", "insee.fr", "conseil-constitutionnel.fr",
  "conseil-etat.fr", "courdecassation.fr", "defenseurdesdroits.fr", "anil.org", "europa.eu",
]

