# Proxy de sortie : seule porte vers Internet des conteneurs du réseau « interne » (SearXNG, Crawl4AI).
# Refuse toute destination interne : adresses privées, loopback, link-local, métadonnées, et les domaines internes.
# Ports 80 et 443 seulement. Aucun cache, aucun journal d'accès (les adresses contiennent les recherches).
http_port 3128
# Sans plafond, Squid réserve une table à la taille de la limite système (énorme sous Docker Desktop ou WSL) et plante.
max_filedescriptors 4096
pid_filename /run/squid/squid.pid
cache deny all
cache_mem 8 MB
cache_log stdio:/dev/stderr
access_log none
logfile_rotate 0
coredump_dir /tmp
pinger_enable off
via off
forwarded_for delete
httpd_suppress_version_string on
request_header_access X-Forwarded-For deny all
dns_nameservers 127.0.0.11
connect_timeout 15 seconds
read_timeout 60 seconds
request_body_max_size 1 MB
reply_body_max_size 20 MB

acl clients src 10.231.30.0/24
acl ports_web port 80 443
acl port_tls port 443
acl CONNECT method CONNECT
acl interdits dst 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/3
acl interdits dst ::/127 ::ffff:0:0/96 64:ff9b::/96 2002::/16 fc00::/7 fe80::/10 ff00::/8
acl domaines_internes dstdomain .local .internal .lan .localhost .home.arpa

http_access deny !clients
http_access deny !ports_web
http_access deny CONNECT !port_tls
http_access deny interdits
http_access deny domaines_internes
http_access allow clients
http_access deny all
