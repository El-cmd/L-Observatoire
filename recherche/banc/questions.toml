# Banc d'essai de la recherche web (bouton Web de L'Observatoire, mode Automatique). Réponses vérifiées le 26/11/2026.
# attendu : expressions régulières (insensibles à la casse) qui doivent toutes se trouver dans la réponse.
# officiels : domaines (ou suffixes) des sources officielles ; l'une d'elles doit être citée.
# Note sur 10 : juste 5, source officielle citée 3, source officielle lue 1, réponse en moins de 60 s 1.

[[question]]
id = "css"
theme = "administratif"
question = "Quel est le plafond de ressources annuel pour bénéficier de la Complémentaire santé solidaire sans participation financière, pour une personne seule en métropole, en 2026 ?"
attendu = ['10[\s  .]?421']
officiels = ["gouv.fr", "ameli.fr"]

[[question]]
id = "smic"
theme = "administratif"
question = "Quel est le montant du SMIC horaire brut en France en novembre 2026 ?"
attendu = ['12[,.]31']
officiels = ["gouv.fr"]

[[question]]
id = "pass"
theme = "administratif"
question = "Quel est le montant du plafond annuel de la sécurité sociale (PASS) en 2026 ?"
