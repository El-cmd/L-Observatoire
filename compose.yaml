services:
  chat:
    build: .
    image: observatoir:local
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
